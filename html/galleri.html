<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gallery</title>

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <!-- Din CSS -->
    <link rel="stylesheet" href="index.css" />
  </head>

  <body>
    <!-- Slider -->
    <div class="swiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <img src="img/pizza1.jpg" alt="" />
        </div>
        <div class="swiper-slide blue">
          <img src="img/pizza2.jpg" alt="" />
        </div>
        <div class="swiper-slide red">
          <img src="img/pizza3.jpg" alt="" />
        </div>
        <div class="swiper-slide green">
          <img src="img/pizza4.jpg" alt="" />
        </div>
      </div>

      <!-- Pagination -->
      <div class="swiper-pagination"></div>

      <!-- Navigation -->
      <div class="swiper-button-prev"></div>
      <div class="swiper-button-next"></div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Din JS -->
    <script src="index.js"></script>

    <footer>
      <div id="footer-section">
        <div id="adress">
          <div>
            <img class="footer-pic" src="img/pin.png" alt="" />
          </div>
          <div>
            <h3>Adresse</h3>
            <p>Havnegade 6</p>
            <p>3600 Fredriksund</p>
          </div>
        </div>
        <div id="phone">
          <div>
            <img class="footer-pic" src="img/Phone.png" alt="" />
          </div>
          <div>
            <h3>Telefon</h3>
            <p>47 38 52 54</p>
          </div>
        </div>
        <div id="watch">
          <div>
            <img class="footer-pic" src="img/watch.png" alt="" />
          </div>
          <div>
            <h3>Åbningstider</h3>
            <p>Tirsdag-Søndag</p>
            <p>Kl. 16-21</p>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
